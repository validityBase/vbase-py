version: 2
updates:
  - package-ecosystem: "pip"
    # Test whether Dependabot can handle the pip-compile layout when it sees
    # both requirements/*.in inputs and requirements/*.txt outputs.
    directory: "/requirements"
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"
    versioning-strategy: "increase-if-necessary"
    groups:
      pip-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      pip-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
