name: Check Documentation and Formatting

on:
  pull_request:
  push:
    branches:
      - dev
  schedule:
    - cron: "19 4 * * 1"

permissions:
  contents: read

jobs:
  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install documentation dependencies
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v2
        with:
          requirements-files: |
            requirements/docs.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Install package without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Build documentation with warnings as errors
        run: sphinx-build -W --keep-going -b markdown docs/ "$RUNNER_TEMP/docs"

  links:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Check README links are absolute for PyPI
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          bad = [
              number
              for number, line in enumerate(Path("README.md").read_text(encoding="utf-8").splitlines(), 1)
              if re.search(r"\]\((?!https?://)[^)]*\)", line)
          ]
          for number in bad:
              print(f"README.md:{number}: link must use an absolute HTTP(S) URL")
          sys.exit(bool(bad))
          PY

      - name: Check documentation links and anchors
        # lychee-action v2.9.0
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: >-
            --root-dir . --include-fragments --no-progress
            --exclude 'localhost|127\.0\.0\.1|<[^>]+>'
            '*.md' 'docs/*.rst' 'internal/**/*.md'

  formatting:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install development dependencies
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v2
        with:
          requirements-files: |
            requirements/dev.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Check formatter hook versions against the lock file
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          import yaml

          config = yaml.safe_load(Path(".pre-commit-config.yaml").read_text(encoding="utf-8"))
          lock = Path("requirements/dev.txt").read_text(encoding="utf-8")
          repositories = {repo["repo"].casefold(): str(repo.get("rev", "")) for repo in config["repos"]}
          formatters = {"black": "https://github.com/psf/black", "isort": "https://github.com/pycqa/isort"}

          errors = []
          for package, repository in formatters.items():
              pin = re.search(rf"^{package}==([^\s]+)", lock, re.MULTILINE)
              revision = repositories.get(repository)
              if pin is None or revision is None or revision.removeprefix("v") != pin[1]:
                  expected = pin[1] if pin else "missing"
                  errors.append(f"{package}: hook revision {revision}, lock version {expected}")
          if errors:
              sys.exit("\n".join(errors))
          PY

      - name: Check formatting
        run: pre-commit run --all-files --show-diff-on-failure
