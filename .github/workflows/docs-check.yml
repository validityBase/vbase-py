name: Check Documentation and Formatting

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "19 4 * * 1"

permissions:
  contents: read

jobs:
  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install documentation dependencies
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v2
        with:
          requirements-files: |
            requirements/docs.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Install package without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Check README links are absolute for PyPI
        run: |
          python -m unittest discover -s .github/scripts -p test_check_readme_links.py
          python .github/scripts/check_readme_links.py

      - name: Build documentation with warnings as errors
        run: sphinx-build -W --keep-going -b markdown docs/ "$RUNNER_TEMP/docs"

  links:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install documentation dependencies
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v2
        with:
          requirements-files: |
            requirements/docs.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Install package without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Build Sphinx HTML for link checks
        run: sphinx-build -W --keep-going -b html docs/ "$RUNNER_TEMP/sphinx-html"

      - name: Check documentation links and anchors
        # lychee-action v2.9.0
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          # The remap checks this repository's blob/main links against the
          # checkout, so a pull request into dev can link to files it adds.
          args: >-
            --root-dir . --include-fragments --no-progress
            --exclude-loopback --exclude '%3C[^/]*%3E'
            --remap 'https://github\.com/validityBase/vbase-py/blob/main/(.*) file://${{ github.workspace }}/$1'
            '*.md' 'docs/*.rst' 'internal/**/*.md'
            '${{ runner.temp }}/sphinx-html/**/*.html'

      - name: Verify broken reStructuredText links are detected
        run: python -m unittest discover -s .github/scripts -p test_sphinx_links.py

  formatting:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install development dependencies
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v2
        with:
          requirements-files: |
            requirements/dev.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Check formatter hook versions against the lock file
        run: python .github/scripts/check_formatter_versions.py

      - name: Check formatting
        run: pre-commit run --all-files --show-diff-on-failure
