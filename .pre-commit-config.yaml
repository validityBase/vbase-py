repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: isort
        language: system
        types_or: [cython, pyi, python]
        args: ["--filter-files"]
        require_serial: true
      - id: black
        name: black
        entry: black
        language: system
        types_or: [python, pyi]
        require_serial: true
