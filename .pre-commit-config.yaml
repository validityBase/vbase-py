repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        # Without --enforce-all the hook checks only files staged as added,
        # so `pre-commit run --all-files` on a CI checkout checks no files.
        args: ["--enforce-all"]
  # Keep formatter revisions aligned with requirements/dev.txt.
  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
